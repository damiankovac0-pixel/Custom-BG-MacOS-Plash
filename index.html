<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>CustomBGPlash</title>
    <link rel="stylesheet" href="styles.css?v=19" />
  </head>
  <body class="preboot intro-active">
    <main class="wallpaper" aria-label="Personal time aware macOS wallpaper">
      <section class="background-stage" aria-hidden="true">
        <video class="wallpaper-video" autoplay muted loop playsinline preload="auto">
          <source src="assets/mahoraga-wheel-of-adaptation.3840x2160.mp4" type="video/mp4" />
        </video>
        <div class="soft-vignette"></div>
        <div class="future-background"></div>
        <div class="hub-core">
          <div class="hub-orbit orbit-a"></div>
          <div class="hub-orbit orbit-b"></div>
          <div class="hub-orbit orbit-c"></div>
          <div class="hub-pulse"></div>
        </div>
        <div class="data-rail rail-a"></div>
        <div class="data-rail rail-b"></div>
        <div class="data-rail rail-c"></div>
        <div class="node-field">
          <span style="--x: 18%; --y: 22%; --d: 0s"></span>
          <span style="--x: 34%; --y: 68%; --d: 1.1s"></span>
          <span style="--x: 57%; --y: 18%; --d: 2.3s"></span>
          <span style="--x: 74%; --y: 44%; --d: 0.7s"></span>
          <span style="--x: 87%; --y: 72%; --d: 1.8s"></span>
        </div>
        <div class="scanline"></div>
      </section>

      <section class="intro" aria-live="polite" aria-label="Wake greeting">
        <p class="intro-kicker" id="phaseLabel">Good Morning</p>
        <h1 id="greeting">Good Morning Damian</h1>
        <p class="intro-time" id="introTime">00:00</p>
        <p class="intro-date" id="introDate">Monday, January 1</p>
      </section>

      <aside class="ambient-clock" aria-label="Current time and date">
        <span id="ambientTime">00:00</span>
        <span id="ambientDate">Mon, Jan 1</span>
      </aside>

      <aside class="background-signals" aria-label="Weather and calendar signals">
        <section class="signal signal-weather" id="weatherSignal" data-status="syncing" aria-label="Weather">
          <svg class="signal-icon" viewBox="0 0 48 48" role="img" aria-label="Cloud icon">
            <path class="icon-glow" d="M16.7 34.6h18.1c5.2 0 9.2-3.6 9.2-8.5 0-4.5-3.4-8.1-7.9-8.5C34.4 12.3 29.7 8.8 24 8.8c-6.4 0-11.6 4.4-12.7 10.4C7 20 4 23.3 4 27.5c0 4.1 3.2 7.1 7.3 7.1h5.4Z" />
            <path d="M16.7 34.6h18.1c5.2 0 9.2-3.6 9.2-8.5 0-4.5-3.4-8.1-7.9-8.5C34.4 12.3 29.7 8.8 24 8.8c-6.4 0-11.6 4.4-12.7 10.4C7 20 4 23.3 4 27.5c0 4.1 3.2 7.1 7.3 7.1h5.4Z" />
          </svg>
          <span class="signal-copy">
            <span class="signal-label">Weather</span>
            <strong id="weatherValue">Syncing</strong>
            <span id="weatherMeta">Waiting for helper</span>
          </span>
        </section>
        <button class="signal signal-calendar" id="calendarSignal" data-status="syncing" type="button" aria-label="Show calendar events" aria-expanded="false" aria-controls="calendarPanel">
          <svg class="signal-icon" viewBox="0 0 48 48" role="img" aria-label="Calendar icon">
            <path class="icon-glow" d="M12 8.5h24A5.5 5.5 0 0 1 41.5 14v22A5.5 5.5 0 0 1 36 41.5H12A5.5 5.5 0 0 1 6.5 36V14A5.5 5.5 0 0 1 12 8.5Z" />
            <path d="M12 8.5h24A5.5 5.5 0 0 1 41.5 14v22A5.5 5.5 0 0 1 36 41.5H12A5.5 5.5 0 0 1 6.5 36V14A5.5 5.5 0 0 1 12 8.5Z" />
            <path d="M14 17.5h20M16.5 6.5v6M31.5 6.5v6M15.5 25h5M22 25h5M28.5 25h5M15.5 31.5h5M22 31.5h5" />
          </svg>
          <span class="signal-copy">
            <span class="signal-label">Calendar</span>
            <strong id="calendarValue">Syncing</strong>
            <span id="calendarMeta">Waiting for helper</span>
          </span>
        </button>
      </aside>

      <section class="calendar-panel" id="calendarPanel" aria-label="Calendar events" hidden>
        <div class="calendar-panel-header">
          <span>Calendar uplink</span>
          <button id="calendarClose" type="button" aria-label="Close calendar events">Close</button>
        </div>
        <section>
          <h2>Today</h2>
          <ol id="todayEvents" class="event-list"></ol>
        </section>
        <section>
          <h2>This week</h2>
          <ol id="weekEvents" class="event-list"></ol>
        </section>
      </section>
    </main>

    <script src="script.js?v=19"></script>
  </body>
</html>
